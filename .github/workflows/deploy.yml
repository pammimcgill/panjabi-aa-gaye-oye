name: Deploy Panjabi Aa Gaye Oye

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # wrangler.toml is git-ignored, so build it from the example when it is not in the repo.
      - run: test -f wrangler.toml || cp wrangler.toml.example wrangler.toml
      # Apply new database migrations. If the API token lacks D1 permission this step is skipped
      # with a warning; the site still works and you can run `npm run db:migrate:remote` yourself.
      - run: npx wrangler d1 migrations apply DB --remote
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
