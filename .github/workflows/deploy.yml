name: Deploy Panjabi Aa Gaye Oye

on:
  pull_request:
    branches: [main]
    paths: ["public/kids/**", "scripts/test-kids-browser.cjs", ".github/workflows/deploy.yml"]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_migrations:
        description: Explicitly apply database migrations
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: npm test
      # wrangler.toml is git-ignored, so build it from the example when it is not in the repo.
      - run: test -f wrangler.toml || cp wrangler.toml.example wrangler.toml
      # Database migrations require an explicit manual workflow request. If permission is absent, skip
      # with a warning; the site still works and you can run `npm run db:migrate:remote` yourself.
      - if: github.event_name == 'workflow_dispatch' && inputs.run_migrations
        run: npx wrangler d1 migrations apply DB --remote
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - if: github.event_name != 'pull_request'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
