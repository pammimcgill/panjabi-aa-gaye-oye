name: Isolated Panjabi Kids review preview
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'prototypes/**'
      - 'scripts/build-kids-preview.mjs'
      - 'wrangler.kids-preview.json'
      - '.github/workflows/kids-preview.yml'
permissions:
  contents: read
concurrency:
  group: kids-pr13-isolated-preview
  cancel-in-progress: true
jobs:
  preview:
    if: github.event.pull_request.number == 13 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/kids-editorial-pilot-2026-10'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test prototypes/panjabi-kids-pnw-pilot.test.cjs
      - run: node scripts/build-kids-preview.mjs
      - run: npm install --no-save --package-lock=false playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-kids-browser.cjs
      - name: Deploy static assets to dedicated review Worker only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing Cloudflare API token'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing Cloudflare account ID'; exit 1; }
          npx wrangler deploy --config wrangler.kids-preview.json 2>&1 | tee /tmp/kids-deploy.log
          echo '## Isolated Panjabi Kids review preview' >> "$GITHUB_STEP_SUMMARY"
          echo "Source commit: ${{ github.event.pull_request.head.sha }}" >> "$GITHUB_STEP_SUMMARY"
          rg -o 'https://[^ ]+\.workers\.dev' /tmp/kids-deploy.log >> "$GITHUB_STEP_SUMMARY" || true
