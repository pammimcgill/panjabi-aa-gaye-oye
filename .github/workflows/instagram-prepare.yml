name: Prepare Instagram comic carousel

on:
  workflow_dispatch:
    inputs:
      comic_slug:
        description: "Approved comic folder slug under public/history-comics/generated"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "Pillow==11.3.0"
      - name: Export existing comic into JPEG carousel
        env:
          COMIC_SLUG: ${{ inputs.comic_slug }}
        run: python scripts/instagram_prepare.py "$COMIC_SLUG"
      - name: Create review PR (not direct publishing)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMIC_SLUG: ${{ inputs.comic_slug }}
        run: |
          set -euo pipefail
          branch="instagram/${COMIC_SLUG}/${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -- "public/instagram/${COMIC_SLUG}/"
          if git diff --cached --quiet; then
            echo "No new Instagram assets to review"
            exit 0
          fi
          git commit -m "Prepare Instagram carousel for ${COMIC_SLUG}"
          git push --set-upstream origin "$branch"
          gh pr create --base main --head "$branch"             --title "Review Instagram carousel: ${COMIC_SLUG}"             --body "Review every slide, caption, historical detail, AI disclosure and link. Merging this PR makes the images public and triggers Instagram publication ONLY if Meta credentials are configured. Do not merge until ready to post."
