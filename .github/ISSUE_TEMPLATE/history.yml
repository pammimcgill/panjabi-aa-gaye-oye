name: History article
description: Publish a source-backed Panjabi history story
title: ""
labels: ["history"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Two or three sentences shown on the homepage and history page.
      placeholder: Explain why this story matters to Panjab and the diaspora.
    validations:
      required: true
  - type: textarea
    id: kids_summary
    attributes:
      label: Kids summary
      description: Optional. Explain this story in one or two accurate sentences for ages 8–13. If blank, the regular Summary is used.
      placeholder: What happened, why it mattered, and how it changed the arrival story—using clear, gentle language.
  - type: textarea
    id: article
    attributes:
      label: Article
      description: Write the story in your own words. Keep quotations short and attributed.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Sources
      description: Add links to the archives, books, museums or scholarship used.
      placeholder: "- https://example.org/source"
    validations:
      required: true
  - type: input
    id: topics
    attributes:
      label: Topics
      description: Optional. Up to four, separated by commas. They become filter buttons on the History page.
      placeholder: "Partition, Sikh Empire, Diaspora"
  - type: input
    id: year
    attributes:
      label: Year
      description: The year the story is about (for example 1907). It places the article on the timeline. Leave blank for culture and heritage pieces.
      placeholder: "1907"
  - type: input
    id: byline
    attributes:
      label: Byline
      description: Optional. Name shown as the author. Leave blank for "Editorial desk".
  - type: input
    id: cover
    attributes:
      label: Cover image URL
      description: Optional. An https link to an image you have the right to use.
  - type: input
    id: historical_image
    attributes:
      label: Historical image URL
      description: Optional. Direct https image address from Wikimedia Commons, an archive or another reusable source.
  - type: input
    id: historical_caption
    attributes:
      label: Historical image caption
      description: Optional. Identify the person, place or document and its date without adding unsupported claims.
  - type: input
    id: historical_credit
    attributes:
      label: Historical image credit
      description: Optional. Photographer, creator or "Unknown photographer," exactly as the source gives it.
  - type: input
    id: historical_source
    attributes:
      label: Historical image source URL
      description: Link to the file-description or archive-record page where readers can verify provenance and reuse rights.
  - type: input
    id: historical_license
    attributes:
      label: Historical image license
      description: For example "Public domain" or "CC BY-SA 4.0." Copy the wording from the source page.
  - type: input
    id: historical_license_url
    attributes:
      label: Historical image license URL
      description: Optional. Link to the public-domain mark or Creative Commons licence.
  - type: dropdown
    id: ai_assistance
    attributes:
      label: AI assistance
      description: If AI helped draft this, say so. The article page then shows a short note to readers.
      options:
        - No AI used
        - Drafted with AI, reviewed and edited by a person
      default: 0
  - type: textarea
    id: verification
    attributes:
      label: Verification notes
      description: Optional. Private notes for editors (disputed figures, quotes to confirm). Never shown on the site.
  - type: checkboxes
    id: editorial
    attributes:
      label: Editorial check
      options:
        - label: I checked names, dates and quotations against the sources above.
          required: true
